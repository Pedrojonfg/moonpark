name: Desktop installers

# Builds the Tauri app with the bundled Python engine on Linux, Windows and macOS.
# Run it by hand (Actions > Desktop installers > Run workflow) or push a tag v*.
# Installers are uploaded as run artifacts and attached to a DRAFT release; nothing is published.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux }
          - { os: windows-latest, name: windows }
          - { os: macos-latest, name: macos }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Build engine and installer
        run: deploy/build-desktop.sh
      - name: Install acceptance smoke (D-a91c)
        run: |
          exe=desktop/src-tauri/engine/moonpark-api
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --port 8765 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -fs http://127.0.0.1:8765/health && break
            sleep 2
          done
          curl -fs http://127.0.0.1:8765/session-memory | python -c "import sys,json; d=json.load(sys.stdin); assert 'session_budget_mb' in d"
          curl -fs "http://127.0.0.1:8765/site?mock=1&local_search=1" | python -c "import sys,json; d=json.load(sys.stdin); assert d['local_search']['leaderboard'], 'no leaderboard'"
          curl -fs -X POST http://127.0.0.1:8765/deep-search \
            -H 'content-type: application/json' \
            -d '{"mock":true,"mode":"total_coverage","lat_min":-89.5,"lat_max":-89.4,"lon_min":222,"lon_max":223,"start":"2027-01-01T00:00:00Z","end":"2027-01-02T00:00:00Z","window_hours":24}' \
            | python -c "import sys,json; d=json.load(sys.stdin); assert d.get('export_rows'), 'no deep mock rows'"
      - uses: actions/upload-artifact@v4
        with:
          name: moonpark-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.rpm
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error

  draft-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft \
            --title "${{ github.ref_name }}" --notes "Draft: desktop installers for Linux, Windows and macOS." \
            $(find installers -type f)
